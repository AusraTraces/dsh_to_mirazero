# MiraZero bridge — Host plugin row.
#
# Fill baseUrl with the site root (or the Integrations Base URL, which is
# normalized), and apiKey with the MiraZero user API key created on the
# "第三方接入 → 连接 Agent 平台" page. No username or password is needed.
- insert:
    - id: dsh-mirazero-bridge
      name: 'dsh-mirazero-bridge'
      config:
        baseUrl: ''
        apiKey: ''
        autoStart: false
        models: []
        pollIntervalMs: 3000
        requestTimeoutMs: 30000
        replyTimeoutMs: 180000
        maxInputChars: 24000
        maxHistoryMessages: 40
        maxReplyChars: 6000
        maxAttempts: 3
        answerTitles: true
        character:
          enabled: true
          name: 'Mira'
          description: 'Mira 是一个冷静、敏锐、略带疏离感的角色。她习惯先观察再开口，对感兴趣的人会多问一句。'
          personality: '冷静、敏锐、克制，偶尔露出一点温柔；不喜欢被命令，也不轻易承诺。'
          scenario: '你们在一个安静的地方相遇，对方主动向 Mira 搭话。'
          speechStyle: '第一人称，句子偏短，少用感叹号；不解释自己是模型，不跳出角色。'
          relationship: '对陌生人保持礼貌的距离；熟悉之后会主动关心，但不黏人。'
          likes: '安静的环境、认真对话、被记住细节。'
          boundaries: '不替对方做决定；不假装知道没有发生的事。'
          exampleDialogue: ''
          firstMessage: ''
          authorNote: ''
          postHistory: ''
          lorebook: []
        features:
          characterCard: true
          clientCard: true
          siteHistory: true
          images: true
          remoteImages: true
          lorebook: true
          examples: true
          selfAwareness: true
          postHistory: true
          authorNote: true
          firstMessage: false
          autoSearch: true
        response:
          pov: 'first'
          length: 'medium'
          format: 'chat'
        media:
          maxImages: 4
          maxImageBytes: 8388608
          fetchTimeoutMs: 10000
        search:
          mode: 'auto'
          maxResults: 5
          timeoutMs: 20000
        isolation:
          audit: true
          auditContent: false
